name: blog-local
services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bloglocal
      POSTGRES_DB: bloglocal
      POSTGRES_PASSWORD: ${LOCAL_DATABASE_PASSWORD:?Run scripts/local/dev.py init first}
    volumes:
      - local_database:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5544:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bloglocal -d bloglocal"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.local
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://bloglocal:${LOCAL_DATABASE_PASSWORD}@database:5432/bloglocal
      SECRET_KEY: ${LOCAL_SECRET_KEY:?Run scripts/local/dev.py init first}
      ENVIRONMENT: local
      CORS_ORIGINS: '["http://localhost:5173","http://127.0.0.1:5173","http://localhost:5180","http://127.0.0.1:5180"]'
      PRIVATE_STORAGE_DIR: /data/private
      PUBLIC_MEDIA_DIR: /data/publication
      UPLOAD_DIR: /data/uploads
      TRANSFER_STORAGE_DIR: /data/transfers
      NOTION_CONNECTIONS_FILE: /run/secrets/notion-connections.json
      NOTION_SYNC_ENABLED: ${NOTION_SYNC_ENABLED:-false}
      LOCAL_ADMIN_PASSWORD: ${LOCAL_ADMIN_PASSWORD:?Run scripts/local/dev.py init first}
    volumes:
      - local_library:/data/private
      - local_publication:/data/publication
      - local_uploads:/data/uploads
      - local_transfers:/data/transfers
      - ./.secrets:/run/secrets
    ports:
      - "127.0.0.1:8001:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 20
volumes:
  local_database:
  local_library:
  local_publication:
  local_uploads:
  local_transfers:
